name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Optionally restrict to specific branches:
    # branches: [main, develop]

# Explicit permissions required for posting review comments
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout the repository
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so GitPython diff vs main works correctly
          fetch-depth: 0

      # ------------------------------------------------------------------ #
      # 2. Set up Python
      # ------------------------------------------------------------------ #
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ------------------------------------------------------------------ #
      # 3. Install dependencies
      # ------------------------------------------------------------------ #
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------ #
      # 4. Validate environment (fail fast if secrets are missing)
      # ------------------------------------------------------------------ #
      - name: Validate secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set."
            exit 1
          fi
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN secret is not set."
            exit 1
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ #
      # 5. Run the AI Code Review
      # ------------------------------------------------------------------ #
      - name: Run AI Code Review
        run: |
          python -m src.cli \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo      "${{ github.repository }}" \
            --model     "gemini-2.5-flash"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ #
      # 6. Upload review artifacts (optional, useful for debugging)
      # ------------------------------------------------------------------ #
      - name: Upload review logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-logs-${{ github.event.pull_request.number }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
